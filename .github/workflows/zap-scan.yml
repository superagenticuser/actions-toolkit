name: "🔍 ZAP security scan"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to scan (baseline)"
        required: true
        default: "https://example.com"

permissions:
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.url }}
          fail_action: false
