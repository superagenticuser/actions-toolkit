name: "🎬 Blender render farm"

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene script under blender-scenes/"
        default: "hope_orbit.py"
      frame_start:
        description: "First frame"
        default: "1"
      frame_end:
        description: "Last frame"
        default: "72"
      jobs:
        description: "Parallel render jobs (frame chunks)"
        default: "8"
      blender_version:
        description: "Blender version"
        default: "4.2.9"
      ntfy_topic:
        description: "ntfy.sh topic for the done ping (optional)"
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunks.outputs.matrix }}
      total: ${{ steps.chunks.outputs.total }}
    steps:
      - id: chunks
        run: |
          python3 - <<'EOF'
          import json, math, os
          start = int('${{ inputs.frame_start }}')
          end = int('${{ inputs.frame_end }}')
          jobs = max(1, int('${{ inputs.jobs }}'))
          per = math.ceil((end - start + 1) / jobs)
          chunks, i, s = [], 0, start
          while s <= end:
              e = min(end, s + per - 1)
              chunks.append({'id': i, 'start': s, 'end': e})
              s, i = e + 1, i + 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'chunk': chunks}) + '\n')
              f.write(f'total={end - start + 1}\n')
          print(f'{end - start + 1} frames across {len(chunks)} chunks: {chunks}')
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/blender-dl
          key: blender-${{ inputs.blender_version }}-linux-x64

      - name: Install Blender
        run: |
          set -o pipefail
          BV="${{ inputs.blender_version }}"
          DEST="$HOME/blender-dl/blender-${BV}-linux-x64"
          if [ ! -x "$DEST/blender" ]; then
            MAJMIN="${BV%.*}"
            mkdir -p "$HOME/blender-dl"
            curl -sSL -o /tmp/blender.tar.xz \
              "https://download.blender.org/release/Blender${MAJMIN}/blender-${BV}-linux-x64.tar.xz"
            tar -xf /tmp/blender.tar.xz -C "$HOME/blender-dl"
          fi
          "$DEST/blender" --version | head -1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxrender1 libsm6 libxfixes3 libxkbcommon0 libegl1 libgl1 libglib2.0-0 libxext6 libxxf86vm1

      - name: Render frames ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
        env:
          ANIM_START: ${{ inputs.frame_start }}
          ANIM_END: ${{ inputs.frame_end }}
          FRAME_START: ${{ matrix.chunk.start }}
          FRAME_END: ${{ matrix.chunk.end }}
          OUTPUT_DIR: frames
        run: |
          set -o pipefail
          BV="${{ inputs.blender_version }}"
          "$HOME/blender-dl/blender-${BV}-linux-x64/blender" --background \
            --python "blender-scenes/${{ inputs.scene }}" 2>&1 | tail -3
          expected=$(( FRAME_END - FRAME_START + 1 ))
          actual=$(ls frames/frame_*.png | wc -l)
          echo "rendered $actual/$expected frames"
          [ "$actual" -eq "$expected" ] || { echo "missing frames"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
          path: frames/
          if-no-files-found: error

  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true

      - name: Stitch video
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          SCENE="${{ inputs.scene }}"
          VIDEO="${SCENE%.py}.mp4"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"
          ls frames/frame_*.png | wc -l
          ffmpeg -y -framerate 24 -start_number 1 -i frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "$VIDEO"
          ls -lh "$VIDEO"
          {
            echo "## 🎬 Render complete"
            echo ""
            echo "**${{ needs.plan.outputs.total }}** frames rendered across **${{ inputs.jobs }}** parallel jobs."
            echo ""
            echo "Video: \`$VIDEO\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: ${{ env.VIDEO }}

      - name: Notify
        if: inputs.ntfy_topic != ''
        run: |
          curl -s --max-time 20 --retry 3 -H "Title: Blender render done" \
            -d "${{ needs.plan.outputs.total }} frames rendered. Video artifact ready." \
            "https://ntfy.sh/${{ inputs.ntfy_topic }}"
