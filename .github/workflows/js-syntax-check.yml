name: "🔎 JS syntax check"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to check"
        default: "."

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node --check every JS file
        run: |
          FAIL=0
          while IFS= read -r f; do
            if ! node --check "$f" 2>&1; then
              echo "❌ $f"
              FAIL=1
            fi
          done < <(find "${{ inputs.path }}" -name '*.js' -not -path '*/node_modules/*' -not -path './.git/*')
          if [ "$FAIL" -eq 1 ]; then
            echo "## 🔎 JS syntax check — FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          COUNT=$(find "${{ inputs.path }}" -name '*.js' -not -path '*/node_modules/*' -not -path './.git/*' | wc -l)
          echo "## 🔎 JS syntax check — ✅ ${COUNT} files OK" >> "$GITHUB_STEP_SUMMARY"
