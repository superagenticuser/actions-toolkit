name: "🗓️ Release from tag"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          git fetch --tags origin
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log "${PREV}..${TAG}" --pretty=format:'- %s (%h)' > notes.md
          else
            git log "${TAG}" --pretty=format:'- %s (%h)' | head -50 > notes.md
          fi
          ARGS="--title $TAG --notes-file notes.md"
          [ "${{ inputs.prerelease }}" = "true" ] && ARGS="$ARGS --prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" $ARGS
          echo "## 🗓️ Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
