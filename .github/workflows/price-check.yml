name: "💰 Crypto price check"

on:
  workflow_dispatch:
    inputs:
      coin:
        description: "Coin id (bitcoin, ethereum, solana…)"
        default: "bitcoin"
      vs:
        description: "Currency (usd, eur, mur…)"
        default: "usd"

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch price (CoinGecko, no key needed)
        run: |
          COIN="${{ inputs.coin }}"
          VS="${{ inputs.vs }}"
          J=$(curl -s --max-time 20 "https://api.coingecko.com/api/v3/simple/price?ids=${COIN}&vs_currencies=${VS}&include_24hr_change=true&include_market_cap=true")
          PRICE=$(jq -r ".[\"$COIN\"][\"$VS\"]" <<< "$J")
          CHG=$(jq -r ".[\"$COIN\"][\"${VS}_24h_change\"]" <<< "$J")
          MCAP=$(jq -r ".[\"$COIN\"][\"${VS}_market_cap\"]" <<< "$J")
          if [ "$PRICE" = "null" ] || [ -z "$PRICE" ]; then
            echo "## 💰 Price check" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Unknown coin id \`$COIN\`. Try \`bitcoin\`, \`ethereum\`, \`solana\`…" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARROW="📈"; awk "BEGIN{exit !($CHG < 0)}" && ARROW="📉"
          {
            echo "## 💰 ${COIN} / ${VS^^}"
            echo ""
            echo "# ${ARROW} ${PRICE} ${VS^^}"
            echo ""
            echo "24h change: ${CHG}% · Market cap: ${MCAP} ${VS^^}"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') · CoinGecko_"
          } >> "$GITHUB_STEP_SUMMARY"
