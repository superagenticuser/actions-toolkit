name: "💾 Repo backup"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository as owner/name"
        required: true
        default: "superagenticuser/actions-toolkit"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          path: backup
          # For private repos, add a PAT with repo scope as a secret and use:
          # token: ${{ secrets.BACKUP_PAT }}

      - name: Archive
        run: |
          SAFE=$(echo "${{ inputs.repo }}" | tr '/' '-')
          tar -czf "${SAFE}.tgz" backup
          ls -lh "${SAFE}.tgz"
          echo "ARCHIVE=${SAFE}.tgz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: repo-backup
          path: ${{ env.ARCHIVE }}
