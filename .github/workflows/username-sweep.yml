name: "🔍 Username sweep"

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Handle to check everywhere"
        default: "torvalds"

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check handle across platforms
        run: |
          U="${{ inputs.username }}"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
          check() { # $1 label $2 url — 404/410 means free, 200/301/302 means taken
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "$UA" -L --max-redirs 2 "$2")
            case "$code" in
              404|410) echo "- 🆓 **$1** — available ($code)" ;;
              200|301|302) echo "- 🔒 **$1** — taken ($code)" ;;
              429) echo "- ⏳ **$1** — rate-limited" ;;
              *) echo "- ❓ **$1** — unclear (HTTP $code)" ;;
            esac
          }
          {
            echo "## 🔍 Username sweep: \`$U\`"
            echo ""
            check "GitHub"      "https://github.com/${U}"
            check "GitLab"      "https://gitlab.com/${U}"
            check "Reddit"      "https://www.reddit.com/user/${U}/"
            check "Medium"      "https://medium.com/@${U}"
            check "Dev.to"      "https://dev.to/${U}"
            check "Codepen"     "https://codepen.io/${U}"
            check "Kaggle"      "https://www.kaggle.com/${U}"
            check "HackerNews"  "https://news.ycombinator.com/user?id=${U}"
            check "ProductHunt" "https://www.producthunt.com/@${U}"
            check "Docker Hub"  "https://hub.docker.com/u/${U}"
            check "npm"         "https://www.npmjs.com/~${U}"
            check "PyPI"        "https://pypi.org/user/${U}/"
            check "Twitch"      "https://www.twitch.tv/${U}"
            check "Vimeo"       "https://vimeo.com/${U}"
            check "SoundCloud"  "https://soundcloud.com/${U}"
            echo ""
            echo "_Heuristic: 404 = free, 200/redirect = taken. Some sites block bots — treat ❓/⏳ as unverified._"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC')_"
          } >> "$GITHUB_STEP_SUMMARY"
