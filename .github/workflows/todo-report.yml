name: "📝 TODO reporter"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to scan"
        default: "."

jobs:
  todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find TODO / FIXME / HACK markers
        run: |
          grep -rn --include='*.js' --include='*.ts' --include='*.py' --include='*.yml' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.git \
            -E 'TODO|FIXME|HACK|XXX' "${{ inputs.path }}" > todos.txt || true
          N=$(wc -l < todos.txt)
          {
            echo "## 📝 TODO report — ${N} markers"
            echo ""
            echo '```'
            head -100 todos.txt
            [ "$N" -gt 100 ] && echo "… and $((N-100)) more (see artifact)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: todo-report
          path: todos.txt
