name: "🔬 Env probe (ubuntu-26.04 canary)"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - name: Probe runner environment
        run: |
          echo "## 🔬 ubuntu-26.04 environment probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          probe() {
            if command -v "$1" >/dev/null 2>&1; then
              ver=$("$@" 2>&1 | head -1)
              echo "- ✅ $1: $ver" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $1: NOT FOUND" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "### Language runtimes" >> "$GITHUB_STEP_SUMMARY"
          probe python3 --version
          probe pip3 --version
          probe python --version
          probe pip --version
          probe node --version
          probe npm --version
          probe go version
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Binaries assumed by workflows" >> "$GITHUB_STEP_SUMMARY"
          probe pandoc --version
          probe dig -v
          probe docker --version
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### OS info" >> "$GITHUB_STEP_SUMMARY"
          echo "- $(lsb_release -d 2>/dev/null || cat /etc/os-release | head -1)" >> "$GITHUB_STEP_SUMMARY"
