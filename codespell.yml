name: "🔤 Spell check"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to check"
        default: "."

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run codespell
        run: |
          pip install --quiet codespell
          codespell --skip="*.min.js,./.git/*,./node_modules/*" "${{ inputs.path }}" \
            && echo "## 🔤 Spell check — ✅ no typos" >> "$GITHUB_STEP_SUMMARY"
