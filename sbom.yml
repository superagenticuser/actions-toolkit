name: "🧾 SBOM generator"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to analyze"
        default: "."

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.path }}
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
