name: "🕸️ Sitemap generator"

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: "URL to start crawling from"
        required: true
        default: "https://example.com"
      max_pages:
        description: "Max pages to crawl"
        default: "100"

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl same-domain links
        env:
          START: ${{ inputs.start_url }}
          MAXP: ${{ inputs.max_pages }}
        run: |
          python3 <<'EOF'
          import os, urllib.request, urllib.parse, html.parser
          start = os.environ['START'].rstrip('/')
          maxp = int(os.environ['MAXP'])
          host = urllib.parse.urlparse(start).netloc
          class P(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      for k, v in attrs:
                          if k == 'href': self.links.append(v)
          seen, queue, pages = set(), [start], []
          while queue and len(pages) < maxp:
              url = queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'actions-toolkit-sitemap/1.0'})
                  html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', 'ignore')
              except Exception:
                  continue
              pages.append(url)
              p = P(); p.feed(html)
              for l in p.links:
                  u = urllib.parse.urljoin(url, l).split('#')[0].rstrip('/')
                  if urllib.parse.urlparse(u).netloc == host and u.startswith('http') and u not in seen:
                      queue.append(u)
          xml = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          xml += [f'  <url><loc>{u}</loc></url>' for u in pages]
          xml.append('</urlset>')
          open('sitemap.xml', 'w').write('\n'.join(xml))
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(
              f"## 🕸️ Sitemap — {len(pages)} pages found\n\nCrawled `{start}` (same domain only).\n")
          print(f'{len(pages)} pages')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml
